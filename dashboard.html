<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard — Msoka IoT Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <!-- All dashboard styles live in style.css under the "Dashboard" section -->
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="loading-auth">
    <div class="auth-loader">
        <div class="loader-text">VERIFYING ACCESS...</div>
    </div>
    <div class="noise-overlay"></div>
    <div class="hud-cursor" data-cursor>
        <div class="hud-cursor-inner"></div>
        <div class="hud-cursor-ornament"></div>
    </div>

    <div class="tech-bg" aria-hidden="true">
        <div class="tech-grid"></div>
        <div class="tech-circuits"></div>
        <div class="tech-scan"></div>
        <div class="tech-orb tech-orb-a"></div>
        <div class="tech-orb tech-orb-b"></div>
    </div>

    <header class="site-header" data-header>
        <nav class="nav container" aria-label="Dashboard navigation">
            <a class="brand" href="index.html" aria-label="Msoka IoT Lab home">
                <img class="brand-logo" src="./images/logo%20500%20%C3%97%20500%20px.png" alt="" aria-hidden="true" />
                <span class="brand-text">Msoka <span>IoT</span> Lab</span>
            </a>
            <div class="user-info" aria-label="Logged-in user">
                <span id="user-email">Loading session…</span>
                <button class="btn ghost" id="logout-btn" style="padding: 0.5rem 1rem; font-size: 0.8rem;">
                    Logout
                </button>
            </div>
        </nav>
    </header>

    <main class="dashboard container">
        <div class="dash-grid">
            <!-- Sidebar nav -->
            <aside class="dash-nav" aria-label="Dashboard sections">
                <h2>LAB CONTROL</h2>
                <div class="dash-menu" role="tablist">
                    <button class="dash-menu-item active" role="tab" aria-selected="true"
                        data-panel="panel-projects">📁 Projects</button>
                    <button class="dash-menu-item" role="tab" aria-selected="false"
                        data-panel="panel-messages">✉ Messages</button>
                </div>
            </aside>

            <!-- Main content -->
            <section class="dash-content" aria-label="Dashboard content">
                <div class="dash-header">
                    <h1 id="dash-title">PROJECTS</h1>
                </div>

                <!-- ── Projects panel ────────────────────────── -->
                <div id="panel-projects" class="dash-panel">
                    <div class="project-form-card">
                        <h2>ADD / EDIT PROJECT</h2>
                        <form id="project-form" class="form-grid" novalidate>
                            <input type="hidden" id="project-id" />

                            <div class="form-group">
                                <label for="proj-name">Project Name</label>
                                <input type="text" id="proj-name" placeholder="e.g., Smart Irrigation" required />
                            </div>

                            <div class="form-group">
                                <label for="proj-image">Image URL</label>
                                <input type="url" id="proj-image" placeholder="https://…" required />
                            </div>

                            <div class="form-group">
                                <label for="proj-video">Video URL (optional)</label>
                                <input type="url" id="proj-video" placeholder="https://…" />
                            </div>

                            <div class="form-group">
                                <label for="proj-status">Status</label>
                                <!-- Styled via style.css .dash-select -->
                                <select id="proj-status" class="dash-select">
                                    <option value="draft">Draft</option>
                                    <option value="published">Published</option>
                                </select>
                            </div>

                            <div class="form-group full-width">
                                <label for="proj-desc">Description</label>
                                <textarea id="proj-desc" rows="3"
                                    placeholder="Describe the project…" required></textarea>
                            </div>

                            <div class="form-group full-width">
                                <button type="submit" class="btn primary" id="save-project-btn">
                                    Save Project
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="dash-header">
                        <h2>PROJECTS LIST</h2>
                    </div>
                    <div id="projects-container" class="projects-list" aria-live="polite">
                        <p style="color: var(--muted);">Fetching projects…</p>
                    </div>
                </div>

                <!-- ── Messages panel ────────────────────────── -->
                <div id="panel-messages" class="dash-panel" hidden>
                    <div class="dash-header">
                        <h2>INBOX</h2>
                    </div>
                    <div id="messages-container" class="messages-list" aria-live="polite">
                        <p style="color: var(--muted);">Loading messages…</p>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script type="module" src="./script.js"></script>
    <script type="module" src="./dashboard.js"></script>
    <script>
        // Simple tab switcher — runs before module scripts finish
        document.querySelector('.dash-menu')?.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-panel]');
            if (!btn) return;

            const panelId = btn.dataset.panel;

            // Toggle buttons
            document.querySelectorAll('.dash-menu-item').forEach((b) => {
                const active = b === btn;
                b.classList.toggle('active', active);
                b.setAttribute('aria-selected', String(active));
            });

            // Toggle panels
            document.querySelectorAll('.dash-panel').forEach((p) => {
                p.hidden = p.id !== panelId;
            });

            // Update heading
            const titles = { 'panel-projects': 'PROJECTS', 'panel-messages': 'MESSAGES' };
            const titleEl = document.getElementById('dash-title');
            if (titleEl) titleEl.textContent = titles[panelId] ?? '';
        });
    </script>
</body>

</html>
